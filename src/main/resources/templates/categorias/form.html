
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title th:text="${categoria.id == null ? 'Nova Categoria' : 'Editar Categoria'} + ' | BiblioTec'">
    BiblioTec - Categoria
  </title>

  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        font-family: 'Trebuchet MS', Arial, sans-serif;
        color: #ffffff;
        background: linear-gradient(145deg, #061638, #0b3766, #087e91, #54b9c4);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px 15px;
        overflow-x: hidden;
    }

    .bolhas {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
    }

    .bolha {
        position: absolute;
        bottom: -100px;
        width: 25px;
        height: 25px;
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-radius: 50%;
        animation: subir 12s infinite ease-in;
    }

    .bolha:nth-child(1) {
        left: 10%;
        animation-duration: 10s;
    }

    .bolha:nth-child(2) {
        left: 30%;
        width: 40px;
        height: 40px;
        animation-duration: 14s;
    }

    .bolha:nth-child(3) {
        left: 55%;
        animation-duration: 11s;
    }

    .bolha:nth-child(4) {
        left: 75%;
        width: 35px;
        height: 35px;
        animation-duration: 16s;
    }

    .bolha:nth-child(5) {
        left: 90%;
        animation-duration: 13s;
    }

    @keyframes subir {
        0% {
            transform: translateY(0);
            opacity: 0;
        }

        20% {
            opacity: 0.7;
        }

        100% {
            transform: translateY(-110vh);
            opacity: 0;
        }
    }

    .formulario-container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 600px;
        padding: 40px;
        border-radius: 22px;
        background: rgba(3, 24, 55, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .cabecalho {
        text-align: center;
        margin-bottom: 30px;
    }

    .cabecalho .icone {
        font-size: 45px;
        margin-bottom: 10px;
    }

    .cabecalho h1 {
        font-size: 29px;
        margin-bottom: 10px;
    }

    .cabecalho p {
        color: #c5eaf0;
        font-size: 14px;
    }

    .grupo-campo {
        margin-bottom: 23px;
    }

    .grupo-campo label {
        display: block;
        margin-bottom: 9px;
        font-weight: bold;
        color: #d9f7ff;
    }

    .grupo-campo input,
    .grupo-campo textarea {
        width: 100%;
        padding: 14px;
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        outline: none;
        background: rgba(255, 255, 255, 0.95);
        color: #12334d;
        font-family: inherit;
        font-size: 15px;
        transition: 0.3s;
    }

    .grupo-campo input:focus,
    .grupo-campo textarea:focus {
        border-color: #54d6df;
        box-shadow: 0 0 10px rgba(84, 214, 223, 0.35);
    }

    .grupo-campo textarea {
        min-height: 120px;
        resize: vertical;
    }

    .ajuda {
        display: block;
        margin-top: 8px;
        color: #b9dce8;
        font-size: 12px;
    }

    /* Mensagens de validação */
    .erro {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 10px;
        padding: 11px 14px;
        color: #ffe1e8;
        background: rgba(190, 48, 83, 0.22);
        border: 1px solid rgba(255, 143, 168, 0.65);
        border-left: 4px solid #ff8fa8;
        border-radius: 9px;
        font-size: 13px;
        font-weight: bold;
        animation: aparecer 0.3s ease;
    }

    .erro::before {
        content: "⚠";
        font-size: 16px;
        color: #ff9db2;
    }

    .grupo-campo input.campo-erro,
    .grupo-campo textarea.campo-erro {
        border-color: #ff8fa8;
        background: #fff0f3;
    }

    @keyframes aparecer {
        from {
            opacity: 0;
            transform: translateY(-5px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .botoes {
        display: flex;
        gap: 12px;
        margin-top: 30px;
    }

    .botao {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 10px;
        text-align: center;
        text-decoration: none;
        font-family: inherit;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .botao-salvar {
        background: #35b9bd;
        color: #062d43;
    }

    .botao-salvar:hover {
        background: #65dce0;
        transform: translateY(-2px);
    }

    .botao-voltar {
        background: rgba(255, 255, 255, 0.15);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .botao-voltar:hover {
        background: rgba(255, 255, 255, 0.25);
    }

    @media (max-width: 600px) {
        .formulario-container {
            padding: 25px 20px;
        }

        .botoes {
            flex-direction: column;
        }

        .cabecalho h1 {
            font-size: 24px;
        }
    }
  </style>
</head>

<body>

<div class="bolhas">
  <div class="bolha"></div>
  <div class="bolha"></div>
  <div class="bolha"></div>
  <div class="bolha"></div>
  <div class="bolha"></div>
</div>

<main class="formulario-container">

  <header class="cabecalho">
    <div class="icone">🐚</div>

    <h1 th:text="${categoria.id == null ? 'Nova Categoria' : 'Editar Categoria'}">
      Nova Categoria
    </h1>

    <p>Preencha os dados para organizar as categorias da biblioteca.</p>
  </header>

  <form th:action="@{/categorias}"
        th:object="${categoria}"
        method="post">

    <input type="hidden" th:field="*{id}">

    <div class="grupo-campo">

      <label for="nome">Nome da categoria</label>

      <input type="text"
             id="nome"
             th:field="*{nome}"
             th:errorclass="campo-erro"
             placeholder="Ex.: Literatura, Suspense, Romance...">

      <small class="ajuda">
        Informe um nome com até 60 caracteres.
      </small>

      <p class="erro"
         th:if="${#fields.hasErrors('nome')}"
         th:errors="*{nome}">
        Erro no nome
      </p>

    </div>

    <div class="grupo-campo">

      <label for="descricao">Descrição</label>

      <textarea id="descricao"
                th:field="*{descricao}"
                th:errorclass="campo-erro"
                placeholder="Escreva uma breve descrição da categoria..."></textarea>

      <small class="ajuda">
        A descrição pode ter até 255 caracteres.
      </small>

      <p class="erro"
         th:if="${#fields.hasErrors('descricao')}"
         th:errors="*{descricao}">
        Erro na descrição
      </p>

    </div>

    <div class="botoes">

      <button type="submit" class="botao botao-salvar">
        💾 Salvar categoria
      </button>

      <a th:href="@{/categorias}" class="botao botao-voltar">
        ← Voltar
      </a>

    </div>

  </form>

</main>

</body>
</html>
